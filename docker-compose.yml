version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: asset_management_web
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=asset_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret_postgres_pass
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_TIMEZONE=Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - asset_network

  db:
    image: postgres:15-alpine
    container_name: asset_management_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=asset_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_postgres_pass
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c min_wal_size=80MB
      -c max_wal_size=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asset_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - asset_network

volumes:
  pgdata:
    driver: local

networks:
  asset_network:
    driver: bridge
