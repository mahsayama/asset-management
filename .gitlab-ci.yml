image: docker:24.0.5
services:
  - docker:24.0.5-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:main

stages:
  - build
  - test
  - deploy

# --- STAGE 1: BUILD ---
build_image:
  stage: build
  script:
    - echo "Login ke GitLab Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Build Docker Image untuk CodeIgniter 3 App..."
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - echo "Push Image ke Registry..."
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG

# --- STAGE 2: APPLICATION TESTING ---
test_application:
  stage: test
  image: php:7.4-cli
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: asset_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_HOST_AUTH_METHOD: trust
  script:
    - apt-get update && apt-get install -y git unzip libpq-dev libsqlite3-dev libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install pdo pdo_pgsql pdo_sqlite pgsql mysqli zip gd bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-progress --no-interaction
    - echo "Testing CodeIgniter 3 Application Boot..."
    - php index.php

# --- STAGE 3: DEPLOY STAGING ---
deploy_staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
    url: http://$SSH_IP:8080
  before_script:
    - apk update && apk add openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Deploy ke STAGING Server..."
    - |
      ssh $SSH_USER@$SSH_IP "
        docker login registry.gitlab.com -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD;
        docker stop web-staging || true;
        docker rm web-staging || true;
        docker pull $IMAGE_TAG;
        
        docker run -d -p 8080:8000 \
          --name web-staging \
          --network asset-network \
          -e DB_CONNECTION=pgsql \
          -e DB_HOST=db-staging \
          -e DB_DATABASE=asset_db \
          -e DB_USERNAME=mahsaserver \
          -e DB_PASSWORD=rahasia_staging \
          $IMAGE_TAG;
      "

# --- STAGE 4: DEPLOY PRODUCTION ---
deploy_production:
  stage: deploy
  image: alpine:latest
  when: manual
  allow_failure: false
  environment:
    name: production
    url: http://$SSH_IP
  before_script:
    - apk update && apk add openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Deploy ke PRODUCTION Server..."
    - |
      ssh $SSH_USER@$SSH_IP "
        docker login registry.gitlab.com -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD;
        docker stop web-production || true;
        docker rm web-production || true;
        docker pull $IMAGE_TAG;
        
        docker run -d -p 80:8000 \
          --name web-production \
          --network asset-network \
          -e DB_CONNECTION=pgsql \
          -e DB_HOST=db-production \
          -e DB_DATABASE=asset_db \
          -e DB_USERNAME=mahsaserver \
          -e DB_PASSWORD=rahasia_prod \
          $IMAGE_TAG;
      "